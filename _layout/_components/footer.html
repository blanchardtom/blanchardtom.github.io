{% if site.contacts and site.contacts.length > 0 %}
<aside class="contact-rail" aria-label="Contact links">
    {% for contact in site.contacts %}
    <a href="{{ contact.url }}" class="contact-link" target="_blank" rel="noopener noreferrer"
        aria-label="{{ contact.label | default(contact.url) }}" title="{{ contact.label | default(contact.url) }}">
        <i class="{{ contact.icon }}"></i>
    </a>
    {% endfor %}
</aside>
{% endif %}
